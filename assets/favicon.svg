<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Rounded Square -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)"/>
  
  <!-- Mini Blackboard / Podium at Top -->
  <rect x="15" y="8" width="34" height="8" rx="3" fill="url(#boardGrad)" stroke="#fbbf24" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="27" y="18" width="10" height="4" rx="1.5" fill="#f59e0b"/>

  <!-- Left Desk Group -->
  <rect x="9" y="26" width="20" height="13" rx="3" fill="#ffffff" filter="url(#shadow)"/>
  <line x1="19" y1="27" x2="19" y2="38" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Left Chairs -->
  <circle cx="14" cy="44" r="3.5" fill="#60a5fa"/>
  <circle cx="24" cy="44" r="3.5" fill="#f472b6"/>

  <!-- Right Desk Group -->
  <rect x="35" y="26" width="20" height="13" rx="3" fill="#ffffff" filter="url(#shadow)"/>
  <line x1="45" y1="27" x2="45" y2="38" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Right Chairs -->
  <circle cx="40" cy="44" r="3.5" fill="#f472b6"/>
  <circle cx="50" cy="44" r="3.5" fill="#60a5fa"/>

  <!-- Bottom Row Center Desk -->
  <rect x="22" y="50" width="20" height="7" rx="2" fill="#e0e7ff" opacity="0.95"/>
  <circle cx="27" cy="59" r="2.2" fill="#38bdf8"/>
  <circle cx="37" cy="59" r="2.2" fill="#fb7185"/>
  
  <!-- Cute Sparkle -->
  <path d="M52 10 L53.5 13.5 L57 15 L53.5 16.5 L52 20 L50.5 16.5 L47 15 L50.5 13.5 Z" fill="#fde047"/>
</svg>
